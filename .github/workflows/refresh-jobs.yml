name: Refresh job data

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One feed write at a time: a manual dispatch racing the daily cron (or a
    # second dispatch) would both commit jobs.json and one push gets rejected.
    concurrency:
      group: refresh-jobs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ingest job boards
        run: node scripts/ingest.mjs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}

      - name: Commit refreshed feed (if changed)
        run: |
          git config user.name "labormin-bot"
          git config user.email "bot@labormin.com"
          if [[ -n "$(git status --porcelain src/data/jobs.json src/data/translation-cache.json src/data/ingest-flags.json)" ]]; then
            git add src/data/jobs.json src/data/translation-cache.json src/data/ingest-flags.json
            git commit -m "chore(data): refresh jobs feed"
            # Rebase over any feed commit that landed while we ingested (~50 min),
            # then push. Fails only on a real conflict; the feed file is
            # regenerated, so conflicts are practically impossible.
            git pull --rebase origin main || (git rebase --abort && exit 1)
            git push
          else
            echo "No changes in jobs feed"
          fi

      # El deploy lo dispara Workers Builds (Git-connected) con cada push.
