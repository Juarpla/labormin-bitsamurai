name: 01 · Actualizar vacantes
run-name: ${{ inputs.sync_d1_only && 'Solo sincronizar D1' || '01 · Actualizar vacantes' }}

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC
  workflow_dispatch:
    inputs:
      sync_d1_only:
        description: 'Solo sincronizar D1 con las vacantes publicadas en main'
        type: boolean
        default: false
      sources:
        description: 'Override LM_SOURCES (e.g. "indeed,seek"). Empty = weekday schedule.'
        required: false
        default: ''
      presentation_only:
        description: 'Prepare the current catalog without fetching sources'
        type: boolean
        default: false
      presentation_max_calls:
        description: 'Override the Vista clara call limit (0–120)'
        type: string
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One feed write at a time: a manual dispatch racing the daily cron (or a
    # second dispatch) would both commit jobs.json and one push gets rejected.
    concurrency:
      group: refresh-jobs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Weekday schedule for the paid Apify sources (Free plan budget):
      # LinkedIn Mon/Wed/Fri · Indeed Tue/Thu · Seek Sat+Tue. Sun = `none`
      # (sentinel: an EMPTY LM_SOURCES would mean "run ALL sources" in ingest).
      - name: Pick Apify sources for today
        if: ${{ !inputs.sync_d1_only && !inputs.presentation_only }}
        id: sources
        env:
          SOURCES_OVERRIDE: ${{ inputs.sources }}
        run: |
          case $(date +%u) in
            1) s=linkedin ;;      # Mon
            2) s=indeed,seek ;;   # Tue
            3) s=linkedin ;;      # Wed
            4) s=indeed ;;        # Thu
            5) s=linkedin ;;      # Fri
            6) s=seek ;;          # Sat
            7) s=none ;;          # Sun — keyless sources only
          esac
          if [[ -n "$SOURCES_OVERRIDE" ]]; then
            s="$SOURCES_OVERRIDE"
          fi
          echo "value=$s" >> "$GITHUB_OUTPUT"
          echo "LM_SOURCES=$s"

      - name: Ingest job boards
        if: ${{ !inputs.sync_d1_only && !inputs.presentation_only }}
        run: node scripts/ingest.mjs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LM_SOURCES: ${{ steps.sources.outputs.value }}

      - name: Commit refreshed feed (if changed)
        if: ${{ !inputs.sync_d1_only && !inputs.presentation_only }}
        run: |
          git config user.name "labormin-bot"
          git config user.email "bot@labormin.com"
          if [[ -n "$(git status --porcelain src/data/jobs.json src/data/jobs-archive.json src/data/ingest-flags.json)" ]]; then
            git add src/data/jobs.json src/data/jobs-archive.json src/data/ingest-flags.json
            git commit -m "chore(data): refresh jobs feed"
            # Rebase over any feed commit that landed while we ingested (~50 min),
            # then push. Fails only on a real conflict; the feed file is
            # regenerated, so conflicts are practically impossible.
            git pull --rebase origin main || (git rebase --abort && exit 1)
            git push
          else
            echo "No changes in jobs feed"
          fi

      - name: Prepare Vista clara and English titles
        if: ${{ !inputs.sync_d1_only }}
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_MODEL: ${{ vars.AGNES_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
          LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER }}
          JOB_PRESENTATION_MAX_CALLS: ${{ inputs.presentation_max_calls || vars.JOB_PRESENTATION_MAX_CALLS }}
        run: node scripts/prepare-job-presentation.mjs

      - name: Commit prepared presentation (if changed)
        if: ${{ !inputs.sync_d1_only }}
        run: |
          if [[ -n "$(git status --porcelain src/data/job-presentation.json)" ]]; then
            git config user.name "labormin-bot"
            git config user.email "bot@labormin.com"
            git add src/data/job-presentation.json
            git commit -m "chore(data): prepare job presentation"
            git pull --rebase origin main || (git rebase --abort && exit 1)
            git push
          fi

      # El deploy lo dispara Workers Builds (Git-connected) con cada push.

      - name: Sincronizar vacantes con D1
        id: d1
        env:
          CATALOG_D1_API_TOKEN: ${{ secrets.CATALOG_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CATALOG_D1_API_TOKEN" ]]; then
            echo 'status=missing_token' >> "$GITHUB_OUTPUT"
            echo '::warning::Sincronización D1 omitida. Falta el secreto CATALOG_D1_API_TOKEN.'
            exit 0
          fi
          node scripts/catalog/import.mjs --remote --jobs-only

      - name: Mostrar resultado de la sincronización D1
        if: ${{ !cancelled() }}
        env:
          D1_STEP_OUTCOME: ${{ steps.d1.outcome }}
          D1_STATUS: ${{ steps.d1.outputs.status }}
          D1_REVISION: ${{ steps.d1.outputs.revision }}
          D1_JOBS: ${{ steps.d1.outputs.jobs }}
        run: |
          case "$D1_STEP_OUTCOME:$D1_STATUS" in
            success:completed)
              result="Completada. D1 confirmó $D1_JOBS registros del feed $D1_REVISION."
              ;;
            success:missing_token)
              result='Omitida. Falta el secreto `CATALOG_D1_API_TOKEN`.'
              ;;
            success:superseded)
              result="Omitida. D1 ya contiene la edición más reciente $D1_REVISION."
              ;;
            skipped:*)
              result='Omitida. La ejecución se detuvo antes de llegar a D1.'
              ;;
            *)
              result='Falló. Revisa el paso «Sincronizar vacantes con D1».'
              ;;
          esac
          printf '### Sincronización de vacantes con D1\n\n%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          echo "$result"
